[package]
name = "ds-cli-report"
description = "The `ds report` domain, over the `ds-report` typed process contract owned by ds-network-reporter."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# Background project reports restore the native user through the fixed
# client; the local reporter engine commands need no credential at all.
ds-cli-auth = { workspace = true }
ds-cli-contract = { workspace = true }
ds-cli-exec = { workspace = true }
serde_json = { workspace = true }

# The reserved computed report identities are the kernel's rule; the headless
# scope lane applies the same predicate the offline lane already enforces.
ds-command-kernel = { workspace = true }
ds-compute-runtime = { path = "../../../ds-command-kernel/crates/ds-compute-runtime" }
ds-report-artifacts = { path = "../../../ds-command-kernel/crates/ds-report-artifacts" }
# The native host of one transformer report run (staging, byte verification,
# receipts, bounded batches), shared with the desktop shell. It spawns no
# process: `ds report project export` hands it the audited `ds-report` engine
# adapter built on ds-cli-exec.
ds-report-host = { path = "../../../ds-web/crates/ds-report-host" }
# The printed transformer's external context: rooms, bundles and the
# ds.print-context/v1 document are ds-project-data's; the governed provider
# door and the bundle fetch are the ones `ds data project-cache seed` lends it.
ds-project-data = { path = "../../../ds-web/crates/ds-project-data" }
ds-cli-data = { workspace = true }
tempfile = "3"
