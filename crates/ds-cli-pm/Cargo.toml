[package]
name = "ds-cli-pm"
description = "The `ds pm` domain: Project Management — the plan, its tasks, the assignment loop and the record of what happened."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
ds-cli-contract = { workspace = true }
# PM answers on a Server. `POST /api/v1/pm` is published on both gateway
# lanes and ds-brain authenticates from the bearer, so the native client
# reaches it directly; the kernel decides what the graph means and which
# command a flag becomes. No desktop bridge: since 2026-09-20 no `ds pm`
# command needs a window.
ds-cli-auth = { workspace = true }
ds-client-core = { workspace = true }
ds-command-kernel = { workspace = true }
# A task's geometry comes from DS Grid objects, and the kernel never opens a
# .dsgrid: `ds-cli-dsgrid` reads the working copy and reprojects the engine's
# projection into the object index the kernel resolves references against.
# Linking the domain is linking the engine crates it already links; nothing
# here probes it.
ds-cli-dsgrid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
