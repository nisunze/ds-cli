[package]
name = "ds-sync-store"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false
description = "The native host of the sync store: SQLite persistence for the kernel's rows and transitions (desktop, CLI, server). No engine, no transport."

[dependencies]
ds-command-kernel = { path = "../.." }
rusqlite = { version = "0.32", features = ["bundled", "blob"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
