[package]
name = "ds-cli-map"
description = "The `ds map` domain: local layers, vector tools and design-layer edits on the paired desktop's map."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
ds-cli-contract = { workspace = true }
# The map lives inside the running application. Every command here is one
# named semantic operation over the paired loopback bridge — there is no
# second route to a map here, and no engine to link.
ds-cli-desktop = { workspace = true }
ds-cli-auth = { workspace = true }
# `--target server` is the SAME four operations against the running Server, so
# the client half of that transport is `ds-cli-server`'s own, not a second copy
# of it here. There is no cycle: nothing in `ds-cli-server` knows `ds map`.
ds-cli-server = { workspace = true }
ds-command-kernel = { workspace = true }
serde_json = { workspace = true }
ds-layer-store = { path = "../../../ds-web/crates/ds-layer-store" }
ds-layer-ops.workspace = true

sha2 = { workspace = true }
tempfile = "3"
