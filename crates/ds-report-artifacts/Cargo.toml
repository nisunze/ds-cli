[package]
name = "ds-report-artifacts"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false
[workspace]
[dependencies]
ds-command-kernel = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.9"
uuid = { version = "1", features = ["v4"] }
[target.'cfg(unix)'.dependencies]
libc = "0.2"
[dev-dependencies]
tempfile = "3"
