[package]
name = "ds-cli-assets"
description = "The `ds assets` domain: Project Assets — the documents a project holds, in folders, with previews, classification and links to the work they belong to."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# Project Assets answer on a Server. ds-brain is the authority on who may
# see a row and every write; the native client reaches `POST /api/v1/assets`
# under the restored credential; the kernel decides what bytes ARE — their
# format, their members, their preview, the folder tree. A promoted geo
# asset lands in this machine's prepared local layer store, the same store
# `ds map local register` writes. No desktop bridge: since 2026-09-20 no
# `ds assets` command needs a window.
ds-cli-auth = { workspace = true }
ds-client-core = { workspace = true }
ds-command-kernel = { workspace = true }
ds-cli-contract = { workspace = true }
ds-layer-store = { path = "../../../ds-command-kernel/crates/ds-layer-store" }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
