[package]
name = "ds-layer-store"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false
[dependencies]
ds-command-kernel = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
tempfile = "3"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
sha2 = "0.10"

# Native host crate, separate from the portable WASM workspace.
[workspace]
