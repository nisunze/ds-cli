[package]
name = "ds-report-host"
description = "The native host of one transformer report run: staging, a closed engine adapter, byte verification, artifact placement, receipts and bounded batches (desktop, CLI, server). No process, no transport, no credential."
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[dependencies]
ds-command-kernel = { path = "../.." }
ds-project-data = { path = "../ds-project-data" }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs"] }

# Native host crate, separate from the portable WASM workspace.
[workspace]
