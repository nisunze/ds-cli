[package]
name = "ds-cli-dsgrid-exchange"
description = "The `ds dsgrid-exchange` domain: classify sources, plan a conversion, and execute it into durable artifacts."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
ds-cli-contract = { workspace = true }
# `ds-grid-exchange` owns classification, the capability matrix, planning and
# execution. This crate loads bytes, maps refusals and shapes a bounded
# projection; it decides nothing about what a conversion means.
ds-grid-exchange = { workspace = true }
# The working-copy catalogue and the one folder walk `link` and `sync` share
# with `inspect|plan|convert`. Both live in the `dsgrid` domain's crate.
ds-cli-dsgrid = { workspace = true }
ds-command-kernel = { workspace = true }
ds-layer-store = { path = "../../../ds-command-kernel/crates/ds-layer-store" }
ds-io = { workspace = true }
serde = { workspace = true }
tempfile = "3"
serde_json = { workspace = true }
sha2 = { workspace = true }
