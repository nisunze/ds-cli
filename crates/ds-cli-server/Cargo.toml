[package]
name = "ds-cli-server"
version.workspace = true
edition.workspace = true
publish.workspace = true
[dependencies]
ds-report-artifacts = { path = "../../../ds-command-kernel/crates/ds-report-artifacts" }
ds-cli-contract.workspace = true
ds-cli-auth.workspace = true
ds-design-workspace.workspace = true
ds-command-kernel.workspace = true
ds-sync-store = { path = "../../../ds-command-kernel/crates/ds-sync-store" }
ds-sync-runtime = { workspace = true }
ds-compute-runtime = { path = "../../../ds-command-kernel/crates/ds-compute-runtime" }
ds-layer-ops.workspace = true
ds-layer-store = { path = "../../../ds-web/crates/ds-layer-store" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ureq.workspace = true
libc.workspace = true
getrandom = "0.2"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "macros"] }
[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
# Seeding a queue with thousands of durable rows — what a host left running
# for months actually holds — is the only honest way to prove the Solar
# projection is bounded rather than hard-failing. It needs the same SQLite the
# store itself uses, and is already in this lock through ds-sync-store.
rusqlite = { version = "0.32", features = ["bundled"] }
# The proof builds the protected device credential a real `ds auth link`
# leaves, so the production authorizer can be exercised over a real machine.
# Two values in that record are the closed core's own — the credential
# audience schema and the native client id — and they are ASKED for here
# rather than copied, so the fixture cannot drift into agreeing with a rule
# the product no longer has. Already in this lock through ds-cli-auth.
ds-client-core = { workspace = true }
