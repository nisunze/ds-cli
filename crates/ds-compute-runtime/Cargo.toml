[package]
name = "ds-compute-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false
[workspace]
[dependencies]
ds-command-kernel = { path = "../.." }
ds-sync-store = { path = "../ds-sync-store" }
ds-network = { path = "../../../ds-network/crates/ds-network" }
ds-solar-contracts = { path = "../../../ds-solar/crates/ds-solar-contracts", default-features = false }
ds-solar-io = { path = "../../../ds-solar/crates/ds-solar-io" }
ds-solar-runtime = { path = "../../../ds-solar/crates/ds-solar-runtime", default-features = false }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
sha2 = "0.10"
rayon = "1"
[dev-dependencies]
tempfile = "3"
# Writing a row exactly as a released Server wrote it — no context member —
# is the only honest way to prove recovery, and that needs the same SQLite
# the store itself uses. Already in this lock through ds-sync-store.
rusqlite = { version = "0.32", features = ["bundled"] }
