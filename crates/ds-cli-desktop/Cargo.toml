[package]
name = "ds-cli-desktop"
description = "The paired-desktop authority surface: deterministic bridge-descriptor discovery and the bounded loopback client."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
ds-cli-contract = { workspace = true }
ds-command-kernel = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
ureq = { workspace = true }

[dev-dependencies]
tempfile = "3"
# `tests/instances.rs` drives this crate's own command handlers over real
# loopback instances. An integration test reaches nothing but the crate's
# public API and its own dev-dependencies, so the three crates the handlers
# already depend on are named again here. No new dependency: every one of
# these is already a dependency of this crate above.
ds-cli-contract = { workspace = true }
ds-command-kernel = { workspace = true }
serde_json = { workspace = true }
