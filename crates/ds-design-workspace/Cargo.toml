[package]
name = "ds-design-workspace"
version = "0.1.0"
edition = "2021"
publish = false
description = "Native offline Design persistence and job lifecycle; no renderer or network transport."

# Its own workspace, deliberately — see docs/contracts/ds-portable-geometry.md §4.
# This is a native host crate (rusqlite, fs2, no WASM) and it legitimately calls
# ds-network. Cargo resolves every workspace member's manifest before building
# any of them, so while this sat in ds-command-kernel's `members` the kernel
# could not build with ds-network absent no matter what the kernel's own
# dependencies said. Its path is unchanged, so ds-cli is unaffected.
[workspace]

[dependencies]
ds-command-kernel = { path = "../.." }
ds-network = { path = "../../../ds-network/crates/ds-network" }
ds-grid-model = { path = "../../../ds-network/crates/ds-grid-model" }
ds-grid-engine = { path = "../../../ds-network/crates/ds-grid-engine" }
ds-grid-exchange = { path = "../../../ds-network/crates/ds-grid-exchange" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
rayon = "1"
fs2 = "0.4"
tempfile = "3"
thiserror = "2"
