[package]
name = "ds-columnar"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# The single centralized implementation of the columnar format contract
# (ds-network/docs/contracts/columnar-format-contract.md). Its encoders and
# decoders (`artifacts`: Arrow and Parquet) run only in the Network engine and
# page unit, behind the typed `columnar_io_v1` calls. Core and the Kernel link
# it without default features: the pure artifact identity, digests, column
# order and the format constants they address and admit artifacts by. They
# store and move columnar bytes and never build or read a column.

[features]
default = ["artifacts"]
bindings = ["dep:tsify", "dep:wasm-bindgen"]
artifacts = ["dep:arrow-array", "dep:arrow-ipc", "dep:arrow-schema", "dep:parquet", "dep:bytes", "dep:ds-geo-lite"]

[dependencies]
tsify = { version = "0.5.8", default-features = false, features = ["js"], optional = true }
wasm-bindgen = { workspace = true, optional = true }
ds-geo-lite = { path = "../ds-geo-lite", features = ["codec"], optional = true }
arrow-array = { version = "56", optional = true }
arrow-ipc = { version = "56", optional = true }
arrow-schema = { version = "56", features = ["serde"], optional = true }
parquet = { version = "56", default-features = false, features = ["arrow", "snap", "base64"], optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# Held artifact bytes the engine reads without a file.
bytes = { version = "1", optional = true }
# Every Core binary links this crate, so it names the DEFLATE backend Core's
# written bytes (PNG, PDF, zip packages) have always used. It arrived through
# ds-io's calamine while Core linked the readers; naming it here keeps every
# written byte unchanged now that reading lives in the Network engine.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }

[dev-dependencies]
