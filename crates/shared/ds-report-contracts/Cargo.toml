[package]
name = "ds-report-contracts"
description = "The report and printing contract shared by the Kernel and the Reporter: print layout, style-resolution and report-format documents, their admission rules and the pure print policies both sides apply. No IO, store, session, transport or Kernel operation."
version = "0.1.0"
# The Kernel's edition: these documents moved out of ds-command-kernel unchanged.
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
ds-geo-lite = { path = "../ds-geo-lite", features = ["overlay"] }
schemars = "1.2.2"
serde = { version = "1", features = ["derive"] }
# The Kernel's JSON semantics: insertion-ordered objects, exact float
# round-trips and raw values keep every captured document byte identical.
serde_json = { version = "1", features = ["preserve_order", "raw_value", "float_roundtrip"] }
sha2 = "0.10"
regex = "1"
base64 = "0.22"
ryu = "1"
time = { version = "=0.3.47", features = ["formatting", "parsing"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
imagesize = "0.13"
