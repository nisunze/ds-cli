[package]
name = "ds-module-contracts"
description = "Managed engine records: the module component catalogue, engine build admission, release catalogues and native installation/selection receipts. Pure decisions over documents; no IO, no Kernel."
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
regex = "1"
time = { version = "=0.3.47", features = ["formatting", "parsing"] }
url = "2"

[features]
default = []
# TypeScript declarations of the UI component name for the Kernel's WASM
# bindings (`ds-command-kernel/wasm`).
bindings = ["dep:tsify", "dep:wasm-bindgen"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
tsify = { version = "0.5.8", default-features = false, features = ["js"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
