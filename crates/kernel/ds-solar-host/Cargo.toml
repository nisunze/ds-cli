[package]
name = "ds-solar-host"
description = "Core host half of the Solar addon boundary: verified files, reference cache and fixed typed task transport."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
base64 = { workspace = true }
ds-solar-contracts = { path = "../../../../ds-solar/crates/ds-solar-contracts", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tracing = "0.1"
tempfile = "3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ds-solar-contracts = { path = "../../../../ds-solar/crates/ds-solar-contracts", default-features = false, features = ["reference-unit"] }
fs2 = "0.4"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
