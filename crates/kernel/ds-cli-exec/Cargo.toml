[package]
name = "ds-cli-exec"
description = "The typed process boundary: locating a sibling DS executable deterministically and invoking it under bounds."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
ds-cli-contract = { workspace = true }
ds-command-kernel = { workspace = true }
ds-network-contracts = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_Foundation", "Win32_Security"] }
