[package]
name = "ds-report-artifacts"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false
[dependencies]
ds-command-kernel = { path = "../ds-command-kernel" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.9"
uuid = { version = "1", features = ["v4"] }
[target.'cfg(unix)'.dependencies]
libc = "0.2"
[dev-dependencies]
ds-sync-store = { path = "../ds-sync-store" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
