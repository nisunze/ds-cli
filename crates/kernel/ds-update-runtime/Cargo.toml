[package]
name = "ds-update-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false
[workspace]
[dependencies]
ds-command-kernel = { path = "../.." }
ds-client-core = { path = "../ds-client-core" }
ds-cli-exec = { path = "../../../ds-cli/crates/ds-cli-exec" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
tempfile = "3"
sha2 = "0.10"
crc32c = "0.6"
ureq = "=3.4.1"
uuid = { version = "1", features = ["v4"] }
[target.'cfg(unix)'.dependencies]
libc = "0.2"
