[package]
name = "ds-elevation-host"
description = "Bounded headless comparison of governed Rwanda and Terrarium elevations"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
ds-network-contracts = { path = "../../../../ds-network/crates/ds-network-contracts", default-features = false }
ds-network-client = { path = "../ds-network-client" }
tempfile = "3"
ds-geo-lite = { path = "../../shared/ds-geo-lite", features = ["projection"] }
ureq = "3.3.0"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
