[package]
name = "ds-native-data"
description = "Typed headless local-source, columnar, elevation and point-cloud application operations."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4.3"
ds-columnar = { path = "../../../../ds-network/crates/ds-columnar" }
ds-io = { path = "../../../../ds-network/crates/ds-io" }
ds-network-contracts = { path = "../../../../ds-network/crates/ds-network-contracts", default-features = false }
ds-network-client = { path = "../ds-network-client" }
tempfile = "3"
ds-update-runtime = { path = "../ds-update-runtime" }
ds-layer-store = { path = "../ds-layer-store" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
ureq = "3.4.1"
image = { version = "0.25", default-features = false, features = ["png"] }
csv = "1"
rayon = "1"
chrono = "0.4"
crc32c = "0.6"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
