[package]
name = "ds-solar-project"
description = "Durable offline Solar project lifecycle and authored input publication."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "UNLICENSED"
repository = "https://github.com/nisunze/ds-solar"

# An application crate: Solar engines are reached by request/response, so no
# engine crate is linked here, optional or not. Local tooling supplies a run's
# calculation explicitly (see run::LocalCalculation).
[dependencies]
base64 = "0.22"
anyhow.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
ds-solar-contracts = { path = "../../../../ds-solar/crates/ds-solar-contracts", default-features = false }
ds-solar-io = { path = "../../../../ds-solar/crates/ds-solar-io" }
ds-solar-reference-host = { path = "../ds-solar-reference-host" }
ds-command-kernel = { path = "../ds-command-kernel" }
ds-report-artifacts = { path = "../ds-report-artifacts" }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value", "float_roundtrip", "preserve_order"] }
schemars = "1.2.2"
sha2.workspace = true
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint"] }
fs2 = "0.4"
tempfile = "3"
