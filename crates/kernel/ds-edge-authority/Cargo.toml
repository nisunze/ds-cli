[package]
name = "ds-edge-authority"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
ds-command-kernel = { path = "../ds-command-kernel" }
base64 = "0.22"
chrono = { version = "=0.4.41", default-features = false, features = ["std", "clock", "serde"] }
rand = "0.9"
rsa = { version = "0.9.8", features = ["sha2"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
ryu = "1"
ureq = "3.3.0"
uuid = { version = "1", features = ["v4"] }
x509-cert = "0.2.5"

[dev-dependencies]
rand_chacha = "0.3"
rand_core = "0.6"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

# Native host crate: not part of the portable WASM workspace.
