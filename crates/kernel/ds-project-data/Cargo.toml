[package]
name = "ds-project-data"
description = "The one Rust owner of a project's geographic context holdings: catalogue facts, the datasets a project declares, coverage-driven acquisition into project rooms, national bundle installation, and the print-context document a transformer prints with. Hosted by ds and by the desktop shell; captured Network projection transport, no Tauri or credential."
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[dependencies]
ds-command-kernel = { path = "../ds-command-kernel", features = ["durable-store"] }
ds-sync-store = { path = "../ds-sync-store" }
ds-layer-store = { path = "../ds-layer-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint"] }
flate2 = "1"
csv = "1"
tempfile = "3"

ds-network-client = { path = "../ds-network-client" }
ds-network-contracts = { path = "../../../../ds-network/crates/ds-network-contracts", default-features = false }
ds-columnar = { path = "../../../../ds-network/crates/ds-columnar" }

[dev-dependencies]

# Native host crate, separate from the portable WASM workspace.
