[package]
name = "ds-client-core"
description = "Closed native Firebase session, project, and transformer-context client owned by ds-command-kernel."
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
ds-gateway-client = { path = "../ds-gateway-client" }
ds-network-contracts = { path = "../../../../ds-network/crates/ds-network-contracts" }
ds-network-client = { path = "../ds-network-client" }
tempfile = "3"
ds-solar-contracts = { path = "../../../../ds-solar/crates/ds-solar-contracts", default-features = false }
base64 = "0.22"
ds-command-kernel = { path = "../ds-command-kernel" }
ed25519-dalek = "2"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
schemars = "1.2.2"
sha2 = "0.10"
time = { version = "=0.3.47", features = ["formatting", "parsing"] }
url = "2"
zeroize = "1"

[dev-dependencies]
serde_json = "1"

# Native host crate: not part of the portable WASM workspace.
