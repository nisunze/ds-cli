[package]
name = "ds-network-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false
[dependencies]
ds-network-contracts = { path = "../../../../ds-network/crates/ds-network-contracts", default-features = false }
ds-cli-exec = { path = "../ds-cli-exec" }
ds-core-contracts = { workspace = true }
serde_json = { version = "1", features = ["raw_value"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tempfile = "3"
[target.'cfg(unix)'.dependencies]
libc = "0.2"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
