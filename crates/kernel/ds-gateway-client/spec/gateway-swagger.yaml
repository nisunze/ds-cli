        "deadline": 30
        "path_translation": "APPEND_PATH_TO_ADDRESS"
    "post":
      "description": |
        Membership-gated local-first artifact lifecycle. `open` binds an
        immutable client run and returns resumable upload sessions or
        already-existing object generations. `status` recovers durable work
        after restart. `finalize` verifies exact bytes and advances the
        operation + variant head only when its server-owned input-base and
        opened-head fences still match. A stale result remains stored but
        does not become current. `list` and `read` expose only current
        project heads and safe output metadata. `download` mints a short-lived
        URL from a server-recorded output id, object path, and exact immutable
        generation; callers never supply storage paths.
      "operationId": "computeArtifactsAction"
      "parameters":
      - "description": "Compute artifact lifecycle request"
        "in": "body"
        "name": "body"
        "required": true
        "schema":
          "additionalProperties": false
          "properties":
            "action":
              "enum":
              - "open"
              - "status"
              - "finalize"
              - "list"
              - "read"
              - "download"
              "type": "string"
            "client_run_id":
              "type": "string"
            "cursor":
              "type": "string"
            "engine":
              "enum":
              - "solar"
              - "print"
              - "vector_tiler"
              - "network_reporter"
              "type": "string"
            "engine_version":
              "type": "string"
            "input_base_fingerprint":
              "pattern": "^[a-f0-9]{64}$"
              "type": "string"
            "limit":
              "maximum": 100
              "minimum": 1
              "type": "integer"
            "operation":
              "type": "string"
            "output_id":
              "type": "string"
            "outputs":
              "items":
                "additionalProperties": false
                "properties":
                  "content_type":
                    "type": "string"
                  "format":
                    "enum":
                    - "csv"
                    - "geojson"
                    - "json"
                    - "md"
                    - "pdf"
                    - "docx"
                    - "pmtiles"
                    - "png"
                    "type": "string"
                  "output_id":
                    "type": "string"
                  "sha256":
                    "pattern": "^[a-f0-9]{64}$"
                    "type": "string"
                  "size_bytes":
                    "maximum": 67108864
                    "minimum": 1
                    "type": "integer"
                "required":
                - "output_id"
                - "format"
                - "content_type"
                - "sha256"
                - "size_bytes"
                "type": "object"
              "maxItems": 100
              "minItems": 1
              "type": "array"
            "project_id":
              "type": "string"
            "variant":
              "type": "string"
            "work_id":
              "type": "string"
          "required":
          - "action"
          - "project_id"
          "type": "object"
      "responses":
        "200":
          "description": "Lifecycle action completed or idempotently replayed"
        "400":
          "description": "Invalid declaration or incomplete upload"
        "401":
          "description": "Authentication required"
        "403":
          "description": "Missing project access or project is read-only"
        "404":
          "description": "Durable work not found"
        "409":
          "description": "Immutable run/object conflict"
        "413":
          "description": "Request body exceeds the bounded contract"
        "500":
          "description": "Storage or authority verification failed"
      "security":
      - "apiKey": []
      "summary": "Publish and discover desktop compute artifacts"
      "x-google-backend":
        "address": "https://ds-brain-261257746301.us-east1.run.app"
        "deadline": 120
        "path_translation": "APPEND_PATH_TO_ADDRESS"
