  "/api/v1/app_installs":
    "options":
      "operationId": "corsEdgeAppInstallHeartbeat"
      "responses":
        "204":
          "description": "Preflight OK"
      "security": []
      "summary": "CORS preflight for desktop install heartbeat"
      "x-google-backend":
        "address": "https://ds-brain-261257746301.us-east1.run.app"
        "deadline": 30
        "jwt_audience": "https://ds-brain-261257746301.us-east1.run.app"
        "path_translation": "APPEND_PATH_TO_ADDRESS"
    "post":
      "description": "Optional Firebase bearer. Registers or renews one bounded desktop-install
        lease; account and organization identity, when present, are derived by ds-brain
        from the verified bearer."
      "operationId": "edgeAppInstallHeartbeat"
      "parameters":
      - "description": "Closed desktop installation heartbeat"
        "in": "body"
        "name": "body"
        "required": true
        "schema":
          "additionalProperties": false
          "properties":
            "action":
              "enum":
              - "heartbeat"
              "type": "string"
            "additions":
              "additionalProperties":
                "additionalProperties": false
                "properties":
                  "release":
                    "maxLength": 200
                    "minLength": 1
                    "type": "string"
                  "state":
                    "enum":
                    - "downloading"
                    - "verifying"
                    - "ready"
                    - "broken"
                    - "removing"
                    "type": "string"
                  "version":
                    "maxLength": 200
                    "minLength": 1
                    "type": "string"
                "required":
                - "version"
                - "release"
                - "state"
                "type": "object"
              "maxProperties": 64
              "type": "object"
            "app_version":
              "maxLength": 200
              "minLength": 1
              "type": "string"
            "arch":
              "enum":
              - "x86_64"
              "type": "string"
            "channel":
              "enum":
              - "stable"
              - "canary"
              - "beta"
              "type": "string"
            "device":
              "enum":
              - "windows"
              - "linux"
              - "macos"
              "type": "string"
            "install_id":
              "format": "uuid"
              "type": "string"
            "os_version":
              "maxLength": 120
              "minLength": 1
              "type": "string"
            "webview_version":
              "maxLength": 120
              "minLength": 1
              "type": "string"
          "required":
          - "action"
          - "install_id"
          - "device"
          - "arch"
          - "app_version"
          - "channel"
          - "os_version"
          - "webview_version"
          "type": "object"
      "responses":
        "200":
          "description": "Installation lease renewed"
        "400":
          "description": "Invalid closed heartbeat declaration"
        "403":
          "description": "Installation is blocked or bound to another principal"
        "413":
          "description": "Heartbeat exceeds the 64 KiB bound"
        "426":
          "description": "Desktop application upgrade required"
        "503":
          "description": "Edge signer or authority is unavailable"
      "security":
      - "apiKey": []
      "summary": "Heartbeat a desktop installation"
      "x-google-backend":
        "address": "https://ds-brain-261257746301.us-east1.run.app"
        "deadline": 120
        "jwt_audience": "https://ds-brain-261257746301.us-east1.run.app"
        "path_translation": "APPEND_PATH_TO_ADDRESS"
