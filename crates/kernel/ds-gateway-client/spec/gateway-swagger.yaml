          "description": "Planning read, preview or apply completed"
        "400":
          "description": "Invalid planning request or graph command"
        "401":
          "description": "Unauthenticated"
        "403":
          "description": "platform.admin capability required"
        "404":
          "description": "Planning revision or graph target not found"
        "409":
          "description": "Revision fence or idempotency conflict"
        "500":
          "description": "Architecture planning operation failed"
        "503":
          "description": "Architecture planning authority unavailable"
      "security":
      - "apiKey": []
      "summary": "Governed architecture planning graph"
      "x-google-backend":
        "address": "https://ds-brain-261257746301.us-east1.run.app"
        "deadline": 30
        "jwt_audience": "https://ds-brain-261257746301.us-east1.run.app"
