"info":
  "description": "Go backend - single entry point"
  "title": "EDS Backend API"
  "version": "2.0.0"
"paths":
  "/api/v1/account/delete":
    "options":
      "operationId": "corsDeleteOwnAccount"
      "responses":
        "204":
          "description": "Preflight OK"
      "security": []
      "summary": "CORS preflight for account deletion"
      "x-google-backend":
        "address": "https://ds-brain-261257746301.us-east1.run.app"
        "deadline": 30
        "jwt_audience": "https://ds-brain-261257746301.us-east1.run.app"
        "path_translation": "APPEND_PATH_TO_ADDRESS"
    "post":
      "description": |
        Deletes the verified caller's DS account and personal data (profile,
        personal notes, uploads, notifications, devices, project memberships
        and the sign-in account). Shared organisation project records are
        kept. Idempotent: an interrupted deletion is finished by sending the
        same request again. Identity always comes from the verified token.
      "operationId": "deleteOwnAccount"
      "parameters":
      - "description": "Explicit deletion confirmation"
        "in": "body"
        "name": "body"
        "required": true
        "schema":
          "additionalProperties": false
          "properties":
            "confirmation":
              "enum":
              - "DELETE_MY_ACCOUNT"
              "type": "string"
          "required":
          - "confirmation"
          "type": "object"
      "responses":
        "200":
          "description": "Account deleted; the body is the deletion receipt"
        "400":
          "description": "Invalid request or missing confirmation; nothing was deleted"
        "401":
          "description": "Unauthenticated, or the account is already deleted"
        "403":
          "description": "The verified identity cannot address its own account data"
        "500":
          "description": "Deletion did not finish; retry the same request"
        "503":
          "description": "Account deletion is unavailable; nothing was deleted"
      "security":
      - "apiKey": []
      "summary": "Delete the caller's own account"
      "x-google-backend":
        "address": "https://ds-brain-261257746301.us-east1.run.app"
        "deadline": 120
        "jwt_audience": "https://ds-brain-261257746301.us-east1.run.app"
        "path_translation": "APPEND_PATH_TO_ADDRESS"
  "/api/v1/admin/rwanda":
    "get":
      "description": |
        action=hierarchy: Returns static admin hierarchy info (province→district→sector→cell→village)
        action=children: Returns children for cascading dropdown selection
        action=wkt: Returns WKT geometry for admin code
        action=query: Returns boundary details by code
        action=locate: Reverse lookup - find admin boundary containing point
      "operationId": "getRwandaAdmin"
      "parameters":
      - "description": "Admin level (for children/locate)"
        "in": "query"
        "name": "level"
        "required": false
        "type": "string"
      - "description": "Parent code (for children action)"
        "in": "query"
        "name": "parent_code"
        "required": false
        "type": "string"
      - "description": "Admin code (for wkt/query action)"
        "in": "query"
        "name": "code"
        "required": false
        "type": "string"
      - "description": "Latitude (for locate action)"
        "in": "query"
        "name": "lat"
        "required": false
        "type": "number"
      - "description": "Longitude (for locate action)"
        "in": "query"
        "name": "lon"
        "required": false
        "type": "number"
      - "description": "Include WKT geometry (for query action)"
        "in": "query"
        "name": "include_geometry"
        "required": false
        "type": "boolean"
      "responses":
        "200":
          "description": "Admin boundary data"
        "400":
          "description": "Bad request - missing required params"
        "404":
          "description": "Boundary not found"
        "500":
          "description": "Internal server error"
      "security":
      - "apiKey": []
      "summary": "Get Rwanda admin hierarchy, children, WKT, query, or locate"
      "x-google-backend":
        "address": "https://ds-brain-bulk-261257746301.us-east1.run.app/api/v1/admin/rwanda"
        "deadline": 60
        "path_translation": "CONSTANT_ADDRESS"
    "options":
      "operationId": "corsRwandaAdmin"
      "responses":
        "204":
          "description": "Preflight OK"
      "security": []
      "summary": "CORS preflight for Rwanda admin bounds"
      "x-google-backend":
        "address": "https://ds-brain-bulk-261257746301.us-east1.run.app/api/v1/admin/rwanda"
        "deadline": 30
        "path_translation": "CONSTANT_ADDRESS"
    "parameters":
    - "description": "Action: hierarchy, children, wkt, query, locate, enrich"
      "enum":
      - "hierarchy"
      - "children"
      - "wkt"
      - "query"
      - "locate"
      - "enrich"
      "in": "query"
      "name": "action"
      "required": true
      "type": "string"
    "post":
      "description": |
        action=enrich: Add admin boundary columns (village, cell, sector, district)
        to a GeoJSON FeatureCollection via BigQuery spatial join.
      "operationId": "postRwandaAdmin"
      "responses":
        "200":
          "description": "Enriched GeoJSON"
        "400":
          "description": "Bad request"
        "500":
          "description": "Internal server error"
      "security":
      - "apiKey": []
      "summary": "Enrich GeoJSON with admin boundary columns"
      "x-google-backend":
        "address": "https://ds-brain-bulk-261257746301.us-east1.run.app/api/v1/admin/rwanda"
        "deadline": 120
        "path_translation": "CONSTANT_ADDRESS"
