[package]
name = "ds-cli-dsgrid"
description = "The `ds dsgrid` domain: canonical `.dsgrid` model identity, inventory and validation, over the authoritative ds-network crates."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
ds-cli-contract = { workspace = true }
# A DS Grid model held locally by the running application is a live session,
# not a file: the application owns which one occupies Profile, and it alone
# can publish a revision under the identity it already holds. That family is
# one named semantic operation each, over the shared paired-session surface.
ds-cli-desktop = { workspace = true }
# The authoritative owners. This crate holds argument handling, projection
# and refusal mapping — and no engineering logic of its own. Every number it
# reports was computed by one of these two crates.
ds-grid-model = { workspace = true }
ds-grid-engine = { workspace = true }
ds-rwanda-admin-bounds = { path = "../../../ds-network-reporter/crates/ds-rwanda-admin-bounds" }
ds-grid-exchange = { workspace = true }
# The one reprojection this stack has: a model CRS to WGS84, exactly as the
# MV print projection reprojects. The task-geometry index reads it here.
ds-geo = { workspace = true }
# The shared workbook writer every tabular export in the stack uses; the
# structure list reaches .xlsx through it and through nothing else. Also the
# native member headers (TYPE/VERSION/UNITS) and digests for the PLS-CADD
# link a working copy carries.
ds-io = { workspace = true }
serde = { workspace = true }
uuid = { version = "1", features = ["v4"] }
serde_json = { workspace = true }
sha2 = { workspace = true }

ds-cli-auth = { workspace = true }
ds-command-kernel = { workspace = true }
ds-layer-store = { path = "../../../ds-command-kernel/crates/ds-layer-store" }
ds-design-workspace = { workspace = true }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
# The host memory figure a spotting batch budgets against.
windows-sys = { workspace = true }
