[package]
name = "ds-cli-survey"
description = "Typed survey form, project-form, template, and project-creation control plane for ds."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
ds-cli-contract = { workspace = true }
ds-cli-auth = { workspace = true }
ds-client-core = { workspace = true }
# The working-area form choice is one operation whichever host runs it: the
# owner is `ds-layer-ops`, and `--target server` is `ds-cli-server`'s own
# transport. No cycle: nothing in either knows `ds survey`.
ds-layer-ops = { workspace = true }
ds-cli-server = { workspace = true }
# Survey moments read the Server's survey-media store (rows in the lane's
# sync store) and hand the rows to the kernel's gallery decisions.
ds-command-kernel = { workspace = true }
ds-compute-runtime = { path = "../../../ds-command-kernel/crates/ds-compute-runtime" }
ds-sync-store = { path = "../../../ds-command-kernel/crates/ds-sync-store" }
# The core's survey hold: decisions in the kernel, bytes in ds-project-data,
# under the same layer root as the working-area form choice.
ds-project-data = { path = "../../../ds-command-kernel/crates/ds-project-data" }
ds-layer-store = { path = "../../../ds-command-kernel/crates/ds-layer-store" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
