[package]
name = "ds-cli-auth"
description = "Thin native auth and project-context host adapter for ds-client-core."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# Test-only. Exposes `weak_network_harness` and the loopback session origin so
# the out-of-crate weak-network acceptance harness can drive this exact host
# against a scripted in-process storage session. No release build enables it:
# it is reached only through this package's own dev-dependency below, and
# dev-dependencies are not built for `cargo build`/`cargo install`.
weak-network-harness = []

[dependencies]
base64 = { workspace = true }
ds-cli-contract = { workspace = true }
ds-cli-desktop = { workspace = true }
ds-client-core = { workspace = true }
# The resumable transfer protocol, owned once and shared with the desktop
# shell. This crate hosts its IO; it never re-decides what a status means.
ds-command-kernel = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
ureq = { workspace = true }
url = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
# A package may dev-depend on itself, and that is the only way a test target
# outside the crate can turn on one of its own features. `cargo test -p
# ds-cli-auth` therefore compiles `tests/weak_network.rs` against a library
# that carries the harness seam, while every non-test build of the same
# library carries none of it.
ds-cli-auth = { path = ".", features = ["weak-network-harness"] }
