[package]
name = "ds-cli-auth"
description = "Thin native auth and project-context host adapter for ds-client-core."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
ds-update-runtime = { path = "../../../ds-command-kernel/crates/ds-update-runtime" }
ds-solar-io = { path = "../../../ds-solar/crates/ds-solar-io", features = ["http-provider"] }
ds-solar-contracts = { path = "../../../ds-solar/crates/ds-solar-contracts", default-features = false }
base64 = { workspace = true }
ds-cli-contract = { workspace = true }
ds-cli-desktop = { workspace = true }
ds-client-core = { workspace = true }
ds-project-data = { path = "../../../ds-command-kernel/crates/ds-project-data" }
ds-report-host = { path = "../../../ds-command-kernel/crates/ds-report-host" }
ds-layer-store = { path = "../../../ds-command-kernel/crates/ds-layer-store" }
ds-sync-store = { path = "../../../ds-command-kernel/crates/ds-sync-store" }
ds-compute-runtime = { path = "../../../ds-command-kernel/crates/ds-compute-runtime" }
ds-edge-authority = { workspace = true }
ds-sync-runtime = { workspace = true }
# The kernel owns transfer terminal causes; the shared runtime hosts its IO.
ds-command-kernel = { workspace = true }
# The project-delete archive: one zip (index first) of gzip NDJSON groups and
# stored objects, with the GCS CRC32C the upload declares. All three already
# build in this workspace.
crc32c = "0.6"
flate2 = "1"
zip = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
ureq = { workspace = true }
url = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
tempfile = "3"
