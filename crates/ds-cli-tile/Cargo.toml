[package]
name = "ds-cli-tile"
description = "The `ds tile` domain: a project's vector-tile outputs — status, preflight, plan, generate, list, add, remove."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
ds-cli-contract = { workspace = true }
# Tile runs are governed by ds-brain and driven by the paired application's
# Pipeline panel. Every command here is one named bridge operation the
# application performs under its own session with the same pipeline client
# its panel uses — the same staleness rule, preflight and dispatch.
ds-cli-desktop = { workspace = true }
serde_json = { workspace = true }
