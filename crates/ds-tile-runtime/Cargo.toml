[package]
name = "ds-tile-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false
[workspace]
[dependencies]
anyhow = "1"
fs2 = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros", "time", "sync", "io-util"] }
