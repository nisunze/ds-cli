[package]
name = "ds-canvas-lite"
description = "Canvas2D viewport, pointer and placement primitives. Digest-pinned snapshot of ds-network/crates/ds-canvas — see vendor/ds-geo-lite/MANIFEST.json."
version = "0.1.0"
# ds-network's workspace edition; the snapshot compiles as it was written.
edition = "2024"
rust-version = "1.90"
publish = false

# The crate root IS the snapshot. `ds-canvas/src/lib.rs` and its siblings use
# crate-root paths (`crate::Bounds`, `crate::drag_started`), so they only stay
# byte-identical if they are a crate of their own rather than a module tree
# grafted under ds-geo-lite. That, and nothing else, is why this is a second
# crate: see docs/contracts/ds-portable-geometry.md §1.
[lib]
name = "ds_canvas_lite"
path = "../../vendor/ds-geo-lite/canvas/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
rstar = "0.12"
