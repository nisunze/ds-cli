[package]
name = "ds-cli-data"
description = "The `ds data` domain: inspect a local source and convert it to the analytical format before analysis reads it; hold and seed the selected project's geographic context on this machine."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
ds-native-data = { workspace = true }
ureq = { workspace = true }
ds-cli-contract = { workspace = true }
ds-cli-desktop = { workspace = true }
# Headless project-cache status and seed restore the native user through the
# fixed client: the reference catalogue and the governed print-context door.
ds-cli-auth = { workspace = true }
# The national boundary authority's own closed client: one path, two exact
# reads, no project and no window.
ds-client-core = { path = "../../kernel/ds-client-core" }
# The decisions (coverage, identity, seed order, decode, overview) are the
# kernel's; the holdings, acquisition loop and bundle installation are
# ds-project-data's, shared with the desktop shell; the rooms are ds-layer-store's.
ds-command-kernel = { workspace = true }
ds-layer-store = { path = "../../kernel/ds-layer-store" }
ds-project-data = { path = "../../kernel/ds-project-data" }
# The columnar format contract's identity, digests and source kinds only.
# The Network engine encodes and reads GeoParquet (`columnar_io_v1`); `ds`
# moves the bytes. See ds-network/docs/contracts/columnar-format-contract.md.
ds-columnar = { path = "../../shared/ds-columnar", default-features = false }
# Reading a local GIS source is the Network engine's typed task; this crate
# keeps the host half (paths, a bare shapefile's sidecars, output files).
ds-network-client = { workspace = true }
ds-network-contracts = { workspace = true }
ds-geo-lite = { workspace = true, features = ["codec"] }
zip = { workspace = true }
ds-elevation-host = { workspace = true }
# Shared project dataset seeds: the Reporter by request/response, the
# project head on the native Sync Center session, publisher tile integrity.
ds-cli-exec = { workspace = true }
ds-sync-runtime = { workspace = true }
crc32c = "0.6"
tempfile = "3"
ds-terrain-host = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
# Test fixtures only: artifacts a test reads back through the engine.
ds-columnar = { path = "../../shared/ds-columnar" }
flate2 = "1"
