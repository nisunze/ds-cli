[package]
name = "ds"
description = "The Data Solutions command line: one door into the stack for a person in a terminal and for a coding agent."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "ds"
path = "src/main.rs"

[dependencies]
ds-cli-auth = { workspace = true }
ds-cli-server = { workspace = true }
ds-cli-contract = { workspace = true }
ds-cli-design = { workspace = true }
ds-cli-desktop = { workspace = true }
ds-cli-feedback = { workspace = true }
ds-cli-map = { workspace = true }
# DS Grid file commands reach the Network addon through the closed process
# client only; this crate links no Grid engine (DECOUPLING-003).
ds-cli-dsgrid = { workspace = true }
# `ds dsgrid-exchange inspect|plan|convert` over the Network addon's closed
# exchange calls (DECOUPLING-003); it links no Grid engine or exchange crate.
ds-cli-dsgrid-exchange = { workspace = true }
ds-cli-report = { workspace = true }
ds-cli-shell = { workspace = true }
ds-cli-workstation = { workspace = true }
ds-cli-mcp = { workspace = true }
ds-cli-skills = { workspace = true }
ds-cli-solar = { workspace = true }
ds-cli-messaging.workspace = true
ds-cli-pm = { workspace = true }
ds-cli-assets = { workspace = true }
ds-cli-installs = { workspace = true }
ds-cli-sre = { workspace = true }
ds-cli-survey = { workspace = true }
ds-cli-style = { workspace = true }
ds-cli-tile = { workspace = true }
ds-cli-data = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }


# The console's code pages are set to UTF-8 at startup so a piped receipt
# reads as the UTF-8 it is (contract 02 §7).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
# Vector CLI fixtures compare receipts and Arrow exports with their Rust owner.
ds-network = { path = "../../../../ds-network/crates/ds-network" }
tempfile = "3"
# tests/gateway_operations.rs proves the CLI and the desktop select the same
# reviewed gateway operations. The binary reaches the core through
# ds-cli-auth; only the contract test names the registry directly.
ds-client-core = { workspace = true }
# tests/domain_smoke.rs proves `ds style read` answers what a layer's fields
# carry from canonical project data with no map, using the same kernel calls
# the command makes. Only the contract test names the kernel directly.
ds-command-kernel = { workspace = true }
# tests/survey_moments.rs seeds the Server's survey-media records exactly as
# `ds survey photo rotate` writes them, then proves the read side and the
# clean through the binary with no gateway.
ds-sync-store = { path = "../../kernel/ds-sync-store" }
ds-report-artifacts = { path = "../../kernel/ds-report-artifacts" }
# tests/domain_smoke.rs seeds a working copy's PLS-CADD link through the same
# store `ds dsgrid model link` writes, then proves `ds dsgrid model unlink`
# removes exactly that link through the binary.
ds-layer-store = { path = "../../kernel/ds-layer-store" }
# Linked-model CLI fixtures use the authoritative typed rows and requests.
ds-grid-model = { workspace = true }
serde = { workspace = true }
ds-grid-engine = { workspace = true }
ds-grid-exchange = { workspace = true }
# tests/domain_smoke.rs opens the KMZ and Shapefile ZIP `ds dsgrid-exchange
# convert` writes, to prove what a client GIS file does and does not hold.
zip = { workspace = true }
ds-solar-contracts = { workspace = true }
# Public cache-only preparation tests seed through the real reference cache
# owner and plan through the same addon capture the command selects.
ds-solar-host = { path = "../../kernel/ds-solar-host" }
ds-cli-exec = { workspace = true }
serde_json = { workspace = true }
# Offline report negative controls use only their own synthetic workspace to
# emulate historical/damaged saved results; they never touch native auth state.
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint"] }

[build-dependencies]
ds-cli-contract = { workspace = true }
