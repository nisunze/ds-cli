[package]
name = "ds-cli-sre"
description = "The `ds sre` domain: bounded platform reliability overview and request-event reads through the native user."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# Reliability is an authenticated, platform-global surface owned by ds-brain
# and `ds-client-core::sre`. The restored native user performs each read; this
# crate never holds a credential, never opens a second API route, and never
# needs a window to ask how the platform is.
ds-cli-auth = { workspace = true }
ds-cli-contract = { workspace = true }
ds-client-core = { workspace = true }
serde_json = { workspace = true }
