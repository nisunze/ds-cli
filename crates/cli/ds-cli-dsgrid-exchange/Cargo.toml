[package]
name = "ds-cli-dsgrid-exchange"
description = "The `ds dsgrid-exchange` domain: classify sources, plan a conversion, and execute it into durable artifacts."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
ds-cli-contract = { workspace = true }
# Classification, the capability matrix, planning and execution belong to the
# exchange owner in the independently installed Network addon, reached
# through the closed `grid-operation` exchange calls (DECOUPLING-003). This
# crate stages bytes, maps refusals, writes verified outputs and shapes a
# bounded projection; it links no Grid engine or exchange crate.
ds-network-contracts = { workspace = true }
ds-network-client = { workspace = true }
# The one folder walk, the limit parser and the captured addon transport the
# `dsgrid` domain already uses.
ds-cli-dsgrid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# The addon returns a conversion's outputs as one stored archive.
zip = { workspace = true }

[dev-dependencies]
tempfile = "3"
