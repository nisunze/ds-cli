[package]
name = "ds-cli-solar"
description = "The `ds solar` domain, over the `ds-solar` process contract owned by the ds-solar workspace."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
base64 = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["std"] }
ds-cli-auth = { workspace = true }
ds-cli-contract = { workspace = true }
ds-cli-exec = { workspace = true }
ds-cli-report = { workspace = true }
ds-cli-server = { workspace = true }
ds-command-kernel = { workspace = true }
ds-solar-contracts = { workspace = true }
ds-solar-host = { path = "../../kernel/ds-solar-host" }
ds-solar-project = { path = "../../kernel/ds-solar-project", default-features = false }
ds-compute-runtime = { path = "../../kernel/ds-compute-runtime" }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = "3"
fs2 = "0.4"
