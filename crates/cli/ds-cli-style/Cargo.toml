[package]
name = "ds-cli-style"
description = "The `ds style` domain: read Style Center documents and author guided appearance, labels, dimensions and cartography."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
ds-cli-contract = { workspace = true }
# Styles are governed shared documents behind ds-brain. The restored native
# user reads the catalogue and publishes the document through ds-client-core;
# the transformations in between are the command kernel's, the same module the
# Style Center runs as WASM. No window is part of any of that.
ds-cli-auth = { workspace = true }
ds-command-kernel = { workspace = true }
serde_json = { workspace = true }
