[package]
name = "ds-cli-design"
description = "The `ds design` domain: offline LV compute and governed design collaboration."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
ds-client-core = { workspace = true }
ds-cli-contract = { workspace = true }
ds-cli-auth = { workspace = true }
ds-layer-store = { path = "../../kernel/ds-layer-store" }
# Collaboration commands are governed routes on ds-brain under the native
# credential (`ds-cli-auth`); nothing here pairs with a window. Offline LV
# processing and feature selection delegate to the admitted Network process.
# The engine crates are retained only below for calculation parity tests.
ds-network-contracts = { workspace = true }
ds-network-client = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
sha2 = { workspace = true }
zip = { workspace = true }
ds-design-workspace = { workspace = true }
ds-cli-exec = { workspace = true }
ds-cli-report = { workspace = true }
# `design attachment download --out` stages verified bytes beside the
# destination and persists them without replacing an existing file.
tempfile = "3"

ds-command-kernel = { workspace = true }

[dev-dependencies]
ds-network = { workspace = true }
ds-geo = { workspace = true }
lopdf = { version = "0.45", default-features = false }
# Disk-backed owner-only fixtures shared across ds-cli tests.
ds-cli-contract = { workspace = true, features = ["testing"] }

