name: ci

# `ds` links the authoritative engine crates from the sibling `ds-network`
# workspace by path, and its test suite binds to that repository's real
# `.dsgrid` fixture rather than a vendored copy. `ds map` additionally checks
# every operation and argument key it sends against the paired application's
# own source in `ds-web`. So CI checks out all three repositories side by
# side, in the same layout an operator has locally.
on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ds-cli
        uses: actions/checkout@v4
        with:
          path: data-solutions/ds-cli

      - name: Check out ds-network
        uses: actions/checkout@v4
        with:
          repository: nisunze/ds-network
          path: data-solutions/ds-network
          token: ${{ secrets.WORKSPACE_TOKEN }}

      # Source only — `tests/bridge_parity.rs` reads the bridge's allow-list,
      # the operation schemas and the map snapshot. Nothing here is built.
      - name: Check out ds-web
        uses: actions/checkout@v4
        with:
          repository: nisunze/ds-web
          path: data-solutions/ds-web
          token: ${{ secrets.WORKSPACE_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: data-solutions/ds-cli

      - name: Format
        working-directory: data-solutions/ds-cli
        run: cargo fmt --all --check

      - name: Validate native agent skills
        working-directory: data-solutions/ds-cli
        run: |
          python3 scripts/check.py
          bash scripts/test-install-skills.sh

      - name: Lint
        working-directory: data-solutions/ds-cli
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # --locked so a dependency cannot drift in without the lockfile change
      # being part of the reviewed diff.
      - name: Test
        working-directory: data-solutions/ds-cli
        run: cargo test --locked --workspace --all-features

      # A parity suite that skips reports green, which is worse than no test:
      # it claims a hand-copied field name was checked when nothing looked at
      # it. Prove here that it actually ran.
      - name: Prove bridge parity did not skip
        working-directory: data-solutions/ds-cli
        run: |
          cargo test --locked -p ds --test bridge_parity -- --nocapture 2>&1 \
            | tee bridge-parity.log
          if grep -q "SKIPPED" bridge-parity.log; then
            echo "::error::bridge_parity skipped; the ds-web checkout was not found"
            exit 1
          fi

      - name: Release build
        working-directory: data-solutions/ds-cli
        run: cargo build --locked --release

      # Packaging verifies a staged executable exactly this way. Running it
      # here means a break in build identity surfaces on the PR, not in the
      # release pipeline.
      - name: Verify build identity
        working-directory: data-solutions/ds-cli
        run: |
          ./target/release/ds version --output json
          ./target/release/ds version --output json \
            | grep -q '"product":"ds"'
          ./target/release/ds doctor --output json > /dev/null
