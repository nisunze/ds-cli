[package]
name = "ds-command-kernel"
description = "Shared deterministic DS command and state transitions for native and WASM clients."
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[workspace]
members = ["crates/ds-design-workspace"]
resolver = "2"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
schemars = "1.2.2"
base64 = "0.22"
ds-solar-contracts = { path = "../ds-solar/crates/ds-solar-contracts", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
wasm-bindgen = { version = "0.2", optional = true }
zeroize = "1"
url = "2"
regex = "1"
ds-geo = { path = "../ds-network/crates/ds-geo" }
ds-canvas = { path = "../ds-network/crates/ds-canvas" }
ds-geo-ops = { path = "../ds-network/crates/ds-geo-ops" }
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.41", default-features = false, features = ["encoding"] }
csv = "1.4"
imagesize = "0.13"
# The survey capture pipeline deliberately carries only the codecs it admits.
# Keeping defaults off keeps native and WASM builds free of the larger codec set.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
time = { version = "=0.3.47", features = ["formatting", "parsing"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
