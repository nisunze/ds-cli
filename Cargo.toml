# One source workspace, independently built and released units.
# Kernel owns application state; CLI adapts commands; Interactions owns transient UI.
# Shared contains neutral geometry and upload rules. scripts/check-workspace-boundaries.mjs
# checks direct, optional and transitive dependencies across these groups.
[workspace]
resolver = "3"
members = [
    "crates/kernel/ds-solar-project",
    "crates/cli/ds-solar-cli",
    "crates/kernel/ds-design-session",
    "crates/kernel/ds-solar-native",
    "crates/kernel/ds-solar-reference-host",
    "crates/kernel/ds-solar-host",
    "crates/kernel/ds-terrain-host",
    "crates/kernel/ds-elevation-host",
    "crates/kernel/ds-native-data",
    "crates/cli/ds",
    "crates/cli/ds-cli-assets",
    "crates/cli/ds-cli-auth",
    "crates/cli/ds-cli-contract",
    "crates/cli/ds-cli-data",
    "crates/cli/ds-cli-design",
    "crates/cli/ds-cli-desktop",
    "crates/cli/ds-cli-dsgrid",
    "crates/cli/ds-cli-dsgrid-exchange",
    "crates/cli/ds-cli-feedback",
    "crates/cli/ds-cli-installs",
    "crates/cli/ds-cli-library",
    "crates/cli/ds-cli-map",
    "crates/cli/ds-cli-mcp",
    "crates/cli/ds-cli-messaging",
    "crates/cli/ds-cli-pls",
    "crates/cli/ds-cli-pm",
    "crates/cli/ds-cli-report",
    "crates/cli/ds-cli-server",
    "crates/cli/ds-cli-shell",
    "crates/cli/ds-cli-skills",
    "crates/cli/ds-cli-solar",
    "crates/cli/ds-cli-sre",
    "crates/cli/ds-cli-style",
    "crates/cli/ds-cli-survey",
    "crates/cli/ds-cli-tile",
    "crates/cli/ds-cli-workstation",
    "crates/cli/ds-layer-ops",
    "crates/interactions/ds-canvas",
    "crates/interactions/ds-canvas-graph",
    "crates/interactions/ds-interactions-wasm",
    "crates/interactions/ds-map-interaction",
    "crates/interactions/ds-profile-view",
    "crates/kernel/ds-assets-pdf-host",
    "crates/kernel/ds-cli-exec",
    "crates/kernel/ds-client-core",
    "crates/kernel/ds-gateway-client",
    "crates/kernel/ds-command-kernel",
    "crates/kernel/ds-compute-runtime",
    "crates/kernel/ds-core-contracts",
    "crates/kernel/ds-design-workspace",
    "crates/kernel/ds-edge-authority",
    "crates/kernel/ds-kml",
    "crates/kernel/ds-layer-store",
    "crates/kernel/ds-module-admission",
    "crates/kernel/ds-native-host",
    "crates/kernel/ds-network-client",
    "crates/kernel/ds-profile-grid",
    "crates/kernel/ds-profile-policy",
    "crates/kernel/ds-project-data",
    "crates/kernel/ds-report-artifacts",
    "crates/kernel/ds-report-host",
    "crates/kernel/ds-sync-runtime",
    "crates/kernel/ds-sync-store",
    "crates/kernel/ds-template-test-support",
    "crates/kernel/ds-tile-runtime",
    "crates/kernel/ds-update-runtime",
    "crates/shared/ds-columnar",
    "crates/shared/ds-geo-lite",
    "crates/shared/ds-report-contracts",
    "crates/shared/ds-upload-rules",
    "crates/shared/ds-xlsx-read",
]

[workspace.package]
rust-version = "1.90"
version = "0.1.0"
edition = "2024"
license = "Proprietary"
repository = "https://github.com/nisunze/ds-cli"
authors = ["Data Solutions Engineering"]
publish = false

[workspace.dependencies]
anyhow = "1"
ds-solar-native = { path = "crates/kernel/ds-solar-native" }
ds-solar-reference-host = { path = "crates/kernel/ds-solar-reference-host" }
ds-terrain-host = { path = "crates/kernel/ds-terrain-host" }
ds-elevation-host = { path = "crates/kernel/ds-elevation-host" }
ds-native-data = { path = "crates/kernel/ds-native-data" }
thiserror = "2"
wasm-bindgen = "0.2"
ds-core-contracts = { path = "crates/kernel/ds-core-contracts" }
ds-native-host = { path = "crates/kernel/ds-native-host" }
ds-canvas = { path = "crates/interactions/ds-canvas" }
ds-canvas-graph = { path = "crates/interactions/ds-canvas-graph" }
ds-map-interaction = { path = "crates/interactions/ds-map-interaction" }
base64 = "0.22.1"
# The whole third-party surface. Every entry is already load-bearing in a
# sibling workspace, so this repository introduces no new dependency class.
#
# There is deliberately no argument-parsing dependency. `ds` renders tiered
# help and typed refusals from its own command metadata; a general parser
# would own the bytes of every error and help screen, and those bytes are
# the interface this CLI exists to keep small. See
# docs/contracts/cli-output-contract.md.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Lossless Codex config editing. The parser is required so installation can
# preserve comments/formatting and refuse malformed TOML instead of guessing.
toml_edit = "0.22"
# Loopback transport to the paired desktop bridge. Same crate and major the
# ds-network workspace already builds.
ureq = { version = "3.3.0", features = ["json"] }
# Content digests, for the digest-pinned PLS tasks. Same crate and major the
# ds-network workspace already builds.
sha2 = "0.10"
zstd = "0.13.3"
zeroize = "1"
zip = "2.4.2"
libc = "0.2"
# Session-URI validation for the shared resumable transfer. The URI is a
# credential, so it is parsed exactly as ds-client-core and ds-command-kernel
# already parse it rather than by a second hand-rolled reading. Same crate and
# major both siblings already build, and already in this workspace's lockfile.
url = "2"
# Per-user PATH registration on Windows reads and writes HKCU\Environment
# through the raw Win32 registry API. Same crate and major this workspace's
# own lockfile already resolves transitively.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

ds-cli-contract = { path = "crates/cli/ds-cli-contract" }
ds-cli-auth = { path = "crates/cli/ds-cli-auth" }
ds-cli-server = { path = "crates/cli/ds-cli-server" }
ds-client-core = { path = "crates/kernel/ds-client-core" }
ds-edge-authority = { path = "crates/kernel/ds-edge-authority" }
ds-sync-runtime = { path = "crates/kernel/ds-sync-runtime" }
ds-geo-lite = { path = "crates/shared/ds-geo-lite" }
ds-geo = { path = "../ds-network/crates/ds-geo", features = ["arrow_ipc"] }
ds-cli-desktop = { path = "crates/cli/ds-cli-desktop" }
ds-cli-design = { path = "crates/cli/ds-cli-design" }
ds-cli-exec = { path = "crates/kernel/ds-cli-exec" }
ds-cli-map = { path = "crates/cli/ds-cli-map" }
ds-layer-ops = { path = "crates/cli/ds-layer-ops" }
ds-cli-dsgrid = { path = "crates/cli/ds-cli-dsgrid" }
ds-cli-dsgrid-exchange = { path = "crates/cli/ds-cli-dsgrid-exchange" }
ds-cli-library = { path = "crates/cli/ds-cli-library" }
# `ds` turns the third-party desktop adapters on through its own feature.
ds-cli-pls = { path = "crates/cli/ds-cli-pls", default-features = false }
ds-cli-report = { path = "crates/cli/ds-cli-report" }
ds-cli-solar = { path = "crates/cli/ds-cli-solar" }
ds-cli-messaging = { path = "crates/cli/ds-cli-messaging" }
ds-cli-pm = { path = "crates/cli/ds-cli-pm" }
ds-cli-assets = { path = "crates/cli/ds-cli-assets" }
ds-cli-installs = { path = "crates/cli/ds-cli-installs" }
ds-cli-sre = { path = "crates/cli/ds-cli-sre" }
ds-cli-survey = { path = "crates/cli/ds-cli-survey" }
ds-cli-style = { path = "crates/cli/ds-cli-style" }
ds-cli-tile = { path = "crates/cli/ds-cli-tile" }
ds-cli-data = { path = "crates/cli/ds-cli-data" }
ds-cli-feedback = { path = "crates/cli/ds-cli-feedback" }
ds-cli-shell = { path = "crates/cli/ds-cli-shell" }
ds-cli-workstation = { path = "crates/cli/ds-cli-workstation" }
ds-cli-mcp = { path = "crates/cli/ds-cli-mcp" }
ds-cli-skills = { path = "crates/cli/ds-cli-skills" }
ds-command-kernel = { path = "crates/kernel/ds-command-kernel" }
ds-design-workspace = { path = "crates/kernel/ds-design-workspace" }
ds-solar-contracts = { path = "../ds-solar/crates/ds-solar-contracts" }

# The authoritative engine crates, by path, exactly as ds-web/src-tauri
# reaches them. `ds` links the same code the desktop links; it does not
# reimplement or shell out to a second copy.
ds-grid-model = { path = "../ds-network/crates/ds-grid-model", features = ["arrow"] }
ds-grid-engine = { path = "../ds-network/crates/ds-grid-engine" }
ds-grid-exchange = { path = "../ds-network/crates/ds-grid-exchange" }
ds-grid-composition = { path = "../ds-network/crates/ds-grid-composition" }
ds-grid-tasks = { path = "../ds-network/crates/ds-grid-tasks" }
ds-io = { path = "../ds-network/crates/ds-io" }
ds-network = { path = "../ds-network/crates/ds-network" }
ds-network-contracts = { path = "../ds-network/crates/ds-network-contracts" }
ds-network-client = { path = "crates/kernel/ds-network-client" }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

# Keep the normal local launcher final executable within its disk budget.
# Dependency profiles and debug assertions retain their existing settings.
[profile.dev.package.ds]
strip = "debuginfo"
