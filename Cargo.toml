[package]
name = "ds-command-kernel"
description = "Shared deterministic DS command and state transitions for native and WASM clients."
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[workspace]
members = ["crates/ds-design-workspace"]
resolver = "2"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
base64 = "0.22"
ds-solar-contracts = { path = "../ds-solar/crates/ds-solar-contracts", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wasm-bindgen = { version = "0.2", optional = true }
zeroize = "1"
url = "2"
regex = "1"
ds-geo-ops = { path = "../ds-network/crates/ds-geo-ops" }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
