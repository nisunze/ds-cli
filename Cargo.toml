[package]
name = "ds-command-kernel"
description = "Shared deterministic DS command and state transitions for native and WASM clients."
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

# `crates/ds-design-workspace` is deliberately NOT a member: it is a native
# host crate that legitimately depends on ds-network, and cargo resolves every
# member's manifest before building any of them — so while it sat here the
# kernel could not build with ds-network absent no matter what the kernel's own
# dependencies said. It carries its own [workspace] table at an unchanged path.
# See docs/contracts/ds-portable-geometry.md §4.
[workspace]
members = ["crates/ds-template-test-support", "crates/ds-kml", "crates/ds-geo-lite", "crates/ds-canvas-lite", "crates/ds-sync-store"]
resolver = "2"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
ds-kml = { path = "crates/ds-kml" }
ryu = "1"
schemars = "1.2.2"
base64 = "0.22"
ds-solar-contracts = { path = "../ds-solar/crates/ds-solar-contracts", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
sha2 = "0.10"
wasm-bindgen = { version = "0.2", optional = true }
zeroize = "1"
url = "2"
regex = "1"
# Portable primitives are canonical in ds-geo-lite; Network delegates to it.
# The remaining geometry/canvas snapshots keep their existing drift fence.
# Neither this kernel nor its portable crates depend on ds-network.
ds-geo-lite = { path = "crates/ds-geo-lite", features = ["overlay", "revision", "vector_types"] }
ds-canvas-lite = { path = "crates/ds-canvas-lite" }
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.41", default-features = false, features = ["encoding"] }
csv = "1.4"
imagesize = "0.13"
# The survey capture pipeline deliberately carries only the codecs it admits.
# Keeping defaults off keeps native and WASM builds free of the larger codec set.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
time = { version = "=0.3.47", features = ["formatting", "parsing"] }

[dev-dependencies]
ds-template-test-support = { path = "crates/ds-template-test-support" }
wasm-bindgen-test = "0.3"

[build-dependencies]
sha2 = "0.10"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
