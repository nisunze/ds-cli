[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Proprietary"
repository = "https://github.com/nisunze/ds-interactions"
authors = ["Data Solutions Engineering"]
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wasm-bindgen = "0.2"
ds-canvas = { path = "crates/ds-canvas" }
ds-canvas-graph = { path = "crates/ds-canvas-graph" }
ds-map-interaction = { path = "crates/ds-map-interaction" }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
